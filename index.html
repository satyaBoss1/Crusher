<style>
*{box-sizing:border-box}
body{margin:0;background:#000;font-family:Arial,Helvetica,sans-serif;display:flex;align-items:center;justify-content:center;min-height:100vh;overflow:hidden}
#bg{position:fixed;top:0;left:0;width:100%;height:100%;z-index:0}

h3{margin:0 0 16px;font-size:20px;color:#3f9;letter-spacing:1px}
input{width:100%;font-size:16px;padding:10px;margin-bottom:12px;border:1px solid #0a6;border-radius:6px;background:#020f08;color:#6fa}
input::placeholder{color:#3a7}
button{width:100%;font-size:16px;padding:10px;cursor:pointer;border:0;border-radius:6px;background:#0f8;color:#000;font-weight:700}
button:disabled{opacity:.6}
#lerr{color:#f55;font-size:13px;min-height:18px;margin-bottom:8px}
</style></head>

async function go(e){e.preventDefault();const er=document.getElementById("lerr"),bt=document.getElementById("lbtn");er.innerText="";
if(!(window.crypto&&crypto.subtle)){er.innerText="Chrome ya Edge me kholo";return;}
bt.disabled=true;bt.innerText="Checking...";
try{const km=await crypto.subtle.importKey("raw",new TextEncoder().encode(document.getElementById("lid").value.trim().toLowerCase()+":"+document.getElementById("lpw").value),"PBKDF2",false,["deriveKey"]);
const key=await crypto.subtle.deriveKey({name:"PBKDF2",salt:b64(SALT),iterations:IT,hash:"SHA-256"},km,{name:"AES-GCM",length:256},false,["decrypt"]);
const pt=await crypto.subtle.decrypt({name:"AES-GCM",iv:b64(IV)},key,b64(CT));
const html=new TextDecoder().decode(pt);document.open();document.write(html);document.close();}
catch(x){er.innerText="ID ya Password galat hai";bt.disabled=false;bt.innerText="Login";}}

/* background coding animation (sirf login page par) */
try{(function(){
const c=document.getElementById("bg"),x=c.getContext("2d"),term=document.getElementById("term");
let W,H,cols,drops,last=0;
const chars="01{}[]()<>;=+-*/&|$#@%ABCDEFabcdef".split("");
function size(){W=c.width=innerWidth;H=c.height=innerHeight;cols=Math.floor(W/16);drops=Array.from({length:cols},()=>Math.random()*-50);}
size();addEventListener("resize",size);
function frame(t){if(!c.isConnected)return;requestAnimationFrame(frame);if(t-last<55)return;last=t;
x.fillStyle="rgba(0,0,0,.09)";x.fillRect(0,0,W,H);x.font="14px monospace";
for(let i=0;i<cols;i++){const y=drops[i]*16;x.fillStyle=Math.random()>.97?"#fff":"#0f8";x.fillText(chars[Math.random()*chars.length|0],i*16,y);if(y>H&&Math.random()>.975)drops[i]=0;drops[i]++;}}
requestAnimationFrame(frame);
const cmds=["$ mvn spring-boot:run","[INFO] Scanning for projects...","Started WeighbridgeApplication in 3.2s","$ flutter build apk --release","[OK] Tomcat started on port 8080","$ git commit -m \"weighbridge ticket\"","Connecting to serial port COM3...","[OK] Database connected","$ java -jar svbs.jar","Reading weight from indicator...","Compiling 128 source files...","[OK] Print service ready"];
let lines=[],ci=0,pos=0;
const iv=setInterval(()=>{if(!c.isConnected){clearInterval(iv);return;}
const cmd=cmds[ci];pos++;
if(pos>cmd.length+10){lines.push(cmd);if(lines.length>9)lines.shift();ci=(ci+1)%cmds.length;pos=0;}
term.textContent=lines.join("\n")+"\n"+cmd.slice(0,pos)+(Date.now()%800<400?"\u2588":"");},70);
})();}catch(e){}
</script></body></html>
